description: 'liangyihui is a company operating the web property at liangyihui.net,
  surfaced as a portfolio company of the venture firm Qiming and added to the API Evangelist
  network for enrichment. As of this enrichment pass the company publishes no public
  developer program: no developer portal, no API reference or documentation, no OpenAPI,
  AsyncAPI or GraphQL definition, no first-party SDK packages on any public registry,
  and no working /.well-known/ discovery surface. The public site is served from Chinese
  CDN infrastructure (Tengine / kunlunpi) behind a bot shield that answers every path
  with the same obfuscated JavaScript challenge, so the property soft-404s and cannot
  be crawled or inspected. A live API host does exist at api.liangyihui.net: it answers
  its root with a Tomcat-served "Welcome to LYH!" page and returns genuine HTTP 404s
  for probe paths, indicating a real but private first-party backend for the company''s
  own clients rather than a documented public API. This profile records verified DNS,
  TLS and endpoint posture only; no API artifacts have been fabricated.'
